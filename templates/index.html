<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>Todo</title>
  <style>
    body { font-family: sans-serif; max-width: 480px; margin: 40px auto; }
    li { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
    li.done span { text-decoration: line-through; color: #888; }
    form.add { display: flex; gap: 8px; margin-bottom: 16px; }
    input[type=text] { flex: 1; padding: 6px; }
  </style>
</head>
<body>
  <h1>Todo</h1>
  <form class="add" action="{{ url_for('add') }}" method="post">
    <input type="text" name="title" placeholder="新增待辦事項" required>
    <button type="submit">新增</button>
  </form>
  <ul>
    {% for todo in todos %}
    <li class="{{ 'done' if todo.done else '' }}">
      <form action="{{ url_for('toggle', todo_id=todo.id) }}" method="post">
        <input type="checkbox" onchange="this.form.submit()" {{ 'checked' if todo.done else '' }}>
      </form>
      <span>{{ todo.title }}</span>
    </li>
    {% endfor %}
  </ul>
</body>
</html>
