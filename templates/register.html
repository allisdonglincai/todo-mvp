{% extends "base.html" %}
{% block title %}註冊 - Todo{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="bubble-field" aria-hidden="true"><span></span><span></span><span></span></div>
  <div class="auth-card">
    <h1>註冊</h1>
    <p class="auth-card__lede">建立帳號，開始整理你的待辦事項。</p>
    {% include "_flash.html" %}
    <form action="/register" method="post">
      <div class="field">
        <label for="username">帳號</label>
        <input
          type="text"
          id="username"
          name="username"
          autocomplete="username"
          pattern="[A-Za-z0-9_]{3,30}"
          minlength="3"
          maxlength="30"
          title="3–30 字，只能是英數字與底線"
          required>
        <p class="hint">3–30 碼英數字或底線</p>
      </div>
      <div class="field">
        <label for="password">密碼</label>
        <input
          type="password"
          id="password"
          name="password"
          autocomplete="new-password"
          minlength="8"
          title="至少 8 碼"
          required>
        <p class="hint">至少 8 碼</p>
      </div>
      <button type="submit" class="btn btn--pear btn--full">註冊</button>
    </form>
    <p class="auth-card__foot">已經有帳號？<a href="/login">登入</a></p>
  </div>
</div>
{% endblock %}
