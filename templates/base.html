<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Todo{% endblock %}</title>
<style>
  :root {
    color-scheme: light;
    --color-bg: #f7f7f8;
    --color-surface: #ffffff;
    --color-border: #d8d8dc;
    --color-text: #1a1a1e;
    --color-muted: #6b6b72;
    --color-primary: #2563eb;
    --color-primary-text: #ffffff;
    --color-danger: #b91c1c;
    --color-danger-bg: #fef2f2;
    --color-success: #166534;
    --color-success-bg: #f0fdf4;
    --focus-ring: #2563eb;
  }
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--color-bg);
    color: var(--color-text);
    max-width: 640px;
    margin: 0 auto;
    padding: 24px 16px 64px;
    line-height: 1.5;
  }
  a { color: var(--color-primary); }
  h1 { font-size: 1.5rem; margin: 0 0 16px; }
  h2 { font-size: 1.15rem; margin: 24px 0 8px; }
  label {
    display: block;
    font-size: 0.9rem;
    margin: 12px 0 4px;
  }
  input[type=text],
  input[type=password] {
    width: 100%;
    padding: 10px 12px;
    font-size: 1rem;
    border: 1px solid var(--color-border);
    border-radius: 6px;
    background: var(--color-surface);
    color: var(--color-text);
  }
  button {
    font-size: 0.95rem;
    padding: 10px 16px;
    min-height: 40px;
    border: 1px solid transparent;
    border-radius: 6px;
    background: var(--color-primary);
    color: var(--color-primary-text);
    cursor: pointer;
  }
  button.secondary {
    background: var(--color-surface);
    color: var(--color-text);
    border-color: var(--color-border);
  }
  :focus-visible {
    outline: 2px solid var(--focus-ring);
    outline-offset: 2px;
  }
  .flash-list {
    list-style: none;
    margin: 0 0 16px;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .flash-list li {
    padding: 10px 12px;
    border-radius: 6px;
    font-size: 0.9rem;
  }
  .flash-error {
    background: var(--color-danger-bg);
    color: var(--color-danger);
  }
  .flash-success,
  .flash-message {
    background: var(--color-success-bg);
    color: var(--color-success);
  }

  #loading-overlay {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 12px;
    background: rgba(255, 255, 255, 0.85);
    z-index: 1000;
  }
  #loading-overlay.active { display: flex; }
  .spinner {
    width: 32px;
    height: 32px;
    border: 3px solid var(--color-border);
    border-top-color: var(--color-primary);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @media (prefers-reduced-motion: reduce) {
    .spinner { animation: none; }
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }
  .page-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 20px;
  }
  .user-bar {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 0.9rem;
    color: var(--color-muted);
  }
  .add-form {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
  }
  .add-form input { flex: 1; }
  .todo-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .todo-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 12px;
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: 8px;
  }
  .todo-title { flex: 1; word-break: break-word; }
  .todo-time {
    font-size: 0.8rem;
    color: var(--color-muted);
    white-space: nowrap;
  }
  .status-btn {
    min-height: 40px;
    white-space: nowrap;
  }
  .status-pending { background: var(--color-muted); }
  .status-in_progress { background: #b45309; }
  .status-done { background: var(--color-success); }
  .empty { color: var(--color-muted); padding: 12px 0; }
  .user-section {
    padding: 16px;
    margin-bottom: 16px;
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: 8px;
  }
  .user-section h2 { margin-top: 0; }
  .user-section .todo-item { border-color: var(--color-border); }
  .status-tag {
    font-size: 0.8rem;
    padding: 2px 8px;
    border-radius: 999px;
    color: #fff;
    white-space: nowrap;
  }
</style>
</head>
<body>
<div id="loading-overlay" role="status" aria-live="polite">
  <div class="spinner" aria-hidden="true"></div>
  <p>載入中…</p>
</div>

{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
  <ul class="flash-list" role="status" aria-live="polite">
    {% for category, message in messages %}
    <li class="flash-{{ category }}">{{ message }}</li>
    {% endfor %}
  </ul>
  {% endif %}
{% endwith %}

<main>
  {% block content %}{% endblock %}
</main>

<script>
(function () {
  var overlay = document.getElementById("loading-overlay");
  function showOverlay() {
    overlay.classList.add("active");
  }
  document.addEventListener("submit", showOverlay);
  document.addEventListener("click", function (event) {
    if (event.target.closest("a[href], button[type=submit], input[type=submit]")) {
      showOverlay();
    }
  });
  window.addEventListener("pageshow", function () {
    overlay.classList.remove("active");
  });
})();
</script>
</body>
</html>
